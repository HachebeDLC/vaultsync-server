name: Server Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vaultsync
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: vaultsync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaultsync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      VAULTSYNC_SECRET: ci_test_secret
      DB_HOST: localhost
      DB_NAME: vaultsync
      DB_USER: vaultsync
      DB_PASS: testpass
      REDIS_HOST: localhost
      REDIS_PORT: "6379"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Initialize database schema
        run: python -c "from app.database import init_db; init_db()"

      - name: Run tests
        # The three excluded files are integration tests that need a running
        # VaultSync server instance (see tests/test_api_endpoints.py etc.).
        run: |
          python -m pytest tests/ --asyncio-mode=auto -v \
            --ignore=tests/test_api_endpoints.py \
            --ignore=tests/test_refresh_tokens.py \
            --ignore=tests/test_sse_broadcast.py
